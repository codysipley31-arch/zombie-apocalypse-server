# ---------------------------------------------------------------------------
# The Walking Dead - Lightweight Zombie Apocalypse (QBCore + ox stack)
#
# Deploy from txAdmin using this repository's raw recipe URL:
# https://raw.githubusercontent.com/codysipley31-arch/zombie-apocalypse-server/main/recipe.yaml
# ---------------------------------------------------------------------------
name: The Walking Dead - Zombie Apocalypse
version: 1.0.0
author: Cody
description: Lightweight Walking Dead style survival server. QBCore, ox_inventory, custom zombie AI, infection, looting, crafting and base building. No police, EMS, jobs or dealerships.

$engine: 3
$onesync: on
$steamRequired: false

tasks:
  # --- Cfx default resources (spawnmanager, chat, mapmanager, sessionmanager, baseevents) ---
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources

  # --- ox stack (release builds include the compiled web UIs) ---
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]

  - action: download_file
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip
    path: ./tmp/ox_lib.zip
  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[ox]

  - action: download_file
    url: https://github.com/overextended/ox_inventory/releases/latest/download/ox_inventory.zip
    path: ./tmp/ox_inventory.zip
  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[ox]

  # --- QBCore ---
  - action: download_github
    src: https://github.com/qbcore-framework/qb-core
    dest: ./resources/[qb]/qb-core
  - action: download_github
    src: https://github.com/qbcore-framework/qb-target
    dest: ./resources/[qb]/qb-target

  # --- Appearance ---
  - action: download_file
    url: https://github.com/iLLeniumStudios/illenium-appearance/releases/latest/download/illenium-appearance.zip
    path: ./tmp/illenium-appearance.zip
  - action: unzip
    src: ./tmp/illenium-appearance.zip
    dest: ./resources/[appearance]

  # --- Download this repository's source files ---
  - action: download_github
    src: https://github.com/codysipley31-arch/zombie-apocalypse-server
    ref: main
    dest: ./tmp/zws

  # The repository stores source files at its root. Assemble them into FiveM resources.
  - action: ensure_dir
    path: ./resources/[zombie]/zombie-ai/client
  - action: ensure_dir
    path: ./resources/[zombie]/zombie-ai/server
  - action: ensure_dir
    path: ./resources/[zombie]/zombie-hordes
  - action: ensure_dir
    path: ./resources/[zombie]/zombie-infection
  - action: ensure_dir
    path: ./resources/[survival]/survival-needs/data
  - action: ensure_dir
    path: ./resources/[survival]/survival-looting/client
  - action: ensure_dir
    path: ./resources/[survival]/survival-looting/server
  - action: ensure_dir
    path: ./resources/[survival]/survival-crafting
  - action: ensure_dir
    path: ./resources/[survival]/survival-basebuilding
  - action: ensure_dir
    path: ./resources/[survival]/survival-start

  # --- zombie-ai ---
  - action: copy_path
    src: "./tmp/zws/fxmanifest (17).lua"
    dest: ./resources/[zombie]/zombie-ai/fxmanifest.lua
  - action: copy_path
    src: "./tmp/zws/config (16).lua"
    dest: ./resources/[zombie]/zombie-ai/config.lua
  - action: copy_path
    src: ./tmp/zws/shared.lua
    dest: ./resources/[zombie]/zombie-ai/shared.lua
  - action: copy_path
    src: ./tmp/zws/zombies.lua
    dest: ./resources/[zombie]/zombie-ai/client/zombies.lua
  - action: copy_path
    src: ./tmp/zws/world.lua
    dest: ./resources/[zombie]/zombie-ai/client/world.lua
  - action: copy_path
    src: "./tmp/zws/main (15).lua"
    dest: ./resources/[zombie]/zombie-ai/server/main.lua

  # --- zombie-hordes ---
  - action: copy_path
    src: "./tmp/zws/fxmanifest (23).lua"
    dest: ./resources/[zombie]/zombie-hordes/fxmanifest.lua
  - action: copy_path
    src: "./tmp/zws/config (22).lua"
    dest: ./resources/[zombie]/zombie-hordes/config.lua
  - action: copy_path
    src: "./tmp/zws/client (24).lua"
    dest: ./resources/[zombie]/zombie-hordes/client.lua
  - action: copy_path
    src: "./tmp/zws/server (25).lua"
    dest: ./resources/[zombie]/zombie-hordes/server.lua

  # --- zombie-infection ---
  - action: copy_path
    src: "./tmp/zws/fxmanifest (19).lua"
    dest: ./resources/[zombie]/zombie-infection/fxmanifest.lua
  - action: copy_path
    src: "./tmp/zws/config (18).lua"
    dest: ./resources/[zombie]/zombie-infection/config.lua
  - action: copy_path
    src: "./tmp/zws/client (20).lua"
    dest: ./resources/[zombie]/zombie-infection/client.lua
  - action: copy_path
    src: "./tmp/zws/server (21).lua"
    dest: ./resources/[zombie]/zombie-infection/server.lua

  # --- survival-needs ---
  - action: copy_path
    src: "./tmp/zws/fxmanifest (8).lua"
    dest: ./resources/[survival]/survival-needs/fxmanifest.lua
  - action: copy_path
    src: "./tmp/zws/config (7).lua"
    dest: ./resources/[survival]/survival-needs/config.lua
  - action: copy_path
    src: "./tmp/zws/client (9).lua"
    dest: ./resources/[survival]/survival-needs/client.lua
  - action: copy_path
    src: "./tmp/zws/server (10).lua"
    dest: ./resources/[survival]/survival-needs/server.lua
  - action: copy_path
    src: ./tmp/zws/items.lua
    dest: ./resources/[survival]/survival-needs/data/items.lua

  # --- survival-looting ---
  - action: copy_path
    src: "./tmp/zws/fxmanifest (2).lua"
    dest: ./resources/[survival]/survival-looting/fxmanifest.lua
  - action: copy_path
    src: "./tmp/zws/config (1).lua"
    dest: ./resources/[survival]/survival-looting/config.lua
  - action: copy_path
    src: ./tmp/zws/looting.lua
    dest: ./resources/[survival]/survival-looting/client/looting.lua
  - action: copy_path
    src: ./tmp/zws/vehicles.lua
    dest: ./resources/[survival]/survival-looting/client/vehicles.lua
  - action: copy_path
    src: ./tmp/zws/airdrops.lua
    dest: ./resources/[survival]/survival-looting/client/airdrops.lua
  - action: copy_path
    src: ./tmp/zws/main.lua
    dest: ./resources/[survival]/survival-looting/server/main.lua

  # --- survival-crafting ---
  - action: copy_path
    src: "./tmp/zws/fxmanifest (4).lua"
    dest: ./resources/[survival]/survival-crafting/fxmanifest.lua
  - action: copy_path
    src: "./tmp/zws/config (3).lua"
    dest: ./resources/[survival]/survival-crafting/config.lua
  - action: copy_path
    src: "./tmp/zws/client (5).lua"
    dest: ./resources/[survival]/survival-crafting/client.lua
  - action: copy_path
    src: "./tmp/zws/server (6).lua"
    dest: ./resources/[survival]/survival-crafting/server.lua

  # --- survival-basebuilding ---
  - action: copy_path
    src: ./tmp/zws/fxmanifest.lua
    dest: ./resources/[survival]/survival-basebuilding/fxmanifest.lua
  - action: copy_path
    src: ./tmp/zws/config.lua
    dest: ./resources/[survival]/survival-basebuilding/config.lua
  - action: copy_path
    src: ./tmp/zws/client.lua
    dest: ./resources/[survival]/survival-basebuilding/client.lua
  - action: copy_path
    src: ./tmp/zws/server.lua
    dest: ./resources/[survival]/survival-basebuilding/server.lua

  # --- survival-start ---
  - action: copy_path
    src: "./tmp/zws/fxmanifest (12).lua"
    dest: ./resources/[survival]/survival-start/fxmanifest.lua
  - action: copy_path
    src: "./tmp/zws/config (11).lua"
    dest: ./resources/[survival]/survival-start/config.lua
  - action: copy_path
    src: "./tmp/zws/client (13).lua"
    dest: ./resources/[survival]/survival-start/client.lua
  - action: copy_path
    src: "./tmp/zws/server (14).lua"
    dest: ./resources/[survival]/survival-start/server.lua

  # --- Merge our items into ox_inventory without editing its item list by hand ---
  - action: copy_path
    src: ./resources/[ox]/ox_inventory/data/items.lua
    dest: ./resources/[ox]/ox_inventory/data/items_base.lua
    overwrite: true
  - action: write_file
    file: ./resources/[ox]/ox_inventory/data/items.lua
    data: |
      local items = lib.load('data.items_base')
      local chunk = LoadResourceFile('survival-needs', 'data/items.lua')
      if chunk then
          local extra = load(chunk, '@survival-needs/data/items.lua', 't', {})()
          for name, def in pairs(extra) do items[name] = def end
      else
          print('^1[recipe] survival-needs/data/items.lua not found, custom items missing^0')
      end
      return items

  # --- Database ---
  - action: connect_database
  - action: query_database
    file: ./tmp/zws/survival.sql

  # --- server.cfg ---
  - action: write_file
    file: ./server.cfg
    data: |
      {{serverEndpoints}}

      sv_hostname "{{serverName}}"
      sets sv_projectName "The Walking Dead"
      sets sv_projectDesc "Scavenge. Build. Survive the night."
      sets tags "zombie, survival, walking dead, pve, qbcore, base building"
      sets locale "en-US"

      sv_licenseKey "{{svLicense}}"
      sv_maxclients {{maxClients}}
      set steam_webApiKey ""
      sv_enforceGameBuild 3258
      set onesync on
      sv_scriptHookAllowed 0

      # Database (oxmysql)
      set mysql_connection_string "{{dbConnectionString}}"
      set mysql_ui false

      # ox_lib / ox_inventory
      setr ox:locale "en"
      setr inventory:framework "qb"
      setr inventory:slots 40
      setr inventory:weight 30000
      setr inventory:autoreload true

      # Permissions
      add_ace resource.qb-core command allow
      add_ace qbcore.god command allow
      add_principal qbcore.god group.admin
      add_principal qbcore.god qbcore.admin
      add_principal qbcore.admin qbcore.mod
      add_ace group.admin command allow
      add_ace group.admin command.quit deny

      add_ace resource.ox_lib command.add_ace allow
      add_ace resource.ox_lib command.remove_ace allow
      add_ace resource.ox_lib command.add_principal allow
      add_ace resource.ox_lib command.remove_principal allow

      # Give yourself admin: replace with your own identifier (shown in txAdmin > Players)
      # add_principal identifier.license:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX qbcore.god

      # ---- Default resources ----
      ensure mapmanager
      ensure chat
      ensure spawnmanager
      ensure sessionmanager
      ensure baseevents

      # ---- Core (order matters) ----
      ensure oxmysql
      ensure ox_lib
      ensure qb-core
      ensure ox_inventory
      ensure qb-target
      ensure illenium-appearance

      # ---- Zombies ----
      ensure zombie-ai
      ensure zombie-hordes
      ensure zombie-infection

      # ---- Survival ----
      ensure survival-needs
      ensure survival-looting
      ensure survival-crafting
      ensure survival-basebuilding
      ensure survival-start

  - action: remove_path
    path: ./tmp
